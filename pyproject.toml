[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaponics-controller"
version = "0.1.0"
description = "Autonomous, offline-first Aquaponics controller"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Szilard Gabor LADANYI" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
ape = "aquaponics_controller.cli.main:main"
aquaponics-engine = "aquaponics_controller.engine.main:main"
