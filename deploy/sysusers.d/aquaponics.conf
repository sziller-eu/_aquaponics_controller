# Aquaponics Engine service identity (Issue #9, D2): a system user and group of the same name,
# no login shell, no home directory. Install as /etc/sysusers.d/aquaponics.conf, then run
# systemd-sysusers. Removing this file never removes the user (see the operations documentation).
u aquaponics - "Aquaponics Engine" - -
